<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
  <title id="title">Abstract light–matter interaction illustration</title>
  <desc id="desc">Curved optical modes, excitonic states and an atomically thin interface.</desc>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#163c4a"/>
      <stop offset="1" stop-color="#0d2028"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8bd4d5" stop-opacity=".15"/>
      <stop offset=".5" stop-color="#8bd4d5" stop-opacity="1"/>
      <stop offset="1" stop-color="#f3c6a6" stop-opacity=".3"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="900" height="1100" rx="44" fill="url(#g1)"/>
  <circle cx="700" cy="210" r="170" fill="#4d9da4" opacity=".12" filter="url(#blur)"/>
  <circle cx="215" cy="835" r="210" fill="#e8a97f" opacity=".09" filter="url(#blur)"/>
  <g fill="none" stroke="url(#g2)" stroke-linecap="round">
    <path d="M100 800 C260 760 345 610 445 445 C545 280 650 190 820 155" stroke-width="9"/>
    <path d="M95 230 C255 270 355 405 445 560 C540 725 655 815 820 850" stroke-width="9"/>
    <path d="M110 600 C310 600 345 560 445 445 C540 340 620 310 805 310" stroke-width="3" opacity=".5"/>
    <path d="M110 450 C300 450 360 500 445 560 C545 640 625 685 805 685" stroke-width="3" opacity=".5"/>
  </g>
  <g stroke="#eff7f7" stroke-opacity=".45" stroke-width="2">
    <line x1="80" y1="550" x2="820" y2="550"/>
    <line x1="445" y1="110" x2="445" y2="980"/>
  </g>
  <g>
    <circle cx="445" cy="500" r="17" fill="#f4d8c6"/>
    <circle cx="445" cy="500" r="42" fill="none" stroke="#f4d8c6" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="445" cy="500" r="78" fill="none" stroke="#f4d8c6" stroke-opacity=".2" stroke-width="2"/>
  </g>
  <g opacity=".82">
    <rect x="130" y="900" width="640" height="8" rx="4" fill="#8bd4d5"/>
    <rect x="185" y="925" width="530" height="5" rx="2.5" fill="#f3c6a6" opacity=".7"/>
    <circle cx="360" cy="904" r="12" fill="#eff7f7"/>
    <circle cx="530" cy="904" r="12" fill="#eff7f7"/>
  </g>
  <g fill="#eff7f7" font-family="Arial, sans-serif">
    <text x="90" y="95" font-size="22" letter-spacing="5" opacity=".72">LIGHT–MATTER INTERACTIONS</text>
    <text x="90" y="1030" font-size="18" letter-spacing="3" opacity=".48">EXCITONS   POLARITONS   ULTRAFAST CONTROL</text>
  </g>
</svg>
